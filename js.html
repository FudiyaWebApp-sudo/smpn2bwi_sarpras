  async function callBackendApi(action, payload, onSuccess, onFailure) {
    payload = payload || {};
    payload.action = action;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      const runner = google.script.run
        .withSuccessHandler(function(res) { if (onSuccess) onSuccess(res); })
        .withFailureHandler(function(err) { if (onFailure) onFailure(err); });

      if (action === 'getInitialData') runner.apiGetInitialData();
      else if (action === 'saveAsset') runner.apiSaveAsset(payload.data || payload);
      else if (action === 'deleteAsset') runner.apiDeleteAsset(payload.assetId);
      else if (action === 'saveMaintenance') runner.apiSaveMaintenance(payload.data || payload);
      else if (action === 'saveQuickReportWithImage') runner.apiSaveQuickReportWithImage(payload.data || payload);
      else if (action === 'saveProcurement') runner.apiSaveProcurement(payload.data || payload);
      else if (action === 'saveDisposal') runner.apiSaveDisposal(payload.data || payload);
      else if (action === 'saveUser') runner.apiSaveUser(payload.data || payload);
      else if (action === 'deleteUser') runner.apiDeleteUser(payload.userId);
      else if (action === 'saveSettings') runner.apiSaveSettings(payload.settings || payload.data || {});
      else if (action === 'syncAllData') runner.apiSyncAllData(payload.payload || payload);
      else if (action === 'getDetailIdentifikasiQR') runner.apiGetDetailIdentifikasiQR(payload.code);
      return;
    }

    const targetUrl = GAS_API_URL || localStorage.getItem('DS_GAS_API_URL') || DEFAULT_GAS_API_URL;
    if (!targetUrl) {
      console.warn('[ZettBOT Hub] URL Backend Google Apps Script belum disetel di menu Pengaturan.');
      if (onFailure) onFailure(new Error('URL Web App Google Apps Script belum dikonfigurasi di Pengaturan'));
      return;
    }

    try {
      const response = await fetch(targetUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });

      if (!response.ok) {
        throw new Error('HTTP Status: ' + response.status);
      }

      const data = await response.json();
      if (onSuccess) onSuccess(data);
    } catch (err) {
      console.error('[API Fetch Error]:', err);
      if (onFailure) onFailure(err);
    }
  }

  function playScannerBeep() {
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
      try { navigator.vibrate([80, 40, 80]); } catch (e) {}
    }

    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1760, ctx.currentTime);

        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.12);

        setTimeout(function() {
          try { ctx.close(); } catch (e) {}
        }, 350);
      }
    } catch (err) {
      console.warn('Audio beep feedback error:', err);
    }
  }

  async function toggleCameraScannerRespon() {
    if (isResponCameraRunning) {
      await stopCameraScannerRespon();
    } else {
      await startCameraScannerRespon();
    }
  }

  async function startCameraScannerRespon() {
    const readerEl = document.getElementById('qr-reader-respon');
    const placeholderEl = document.getElementById('qrStandbyPlaceholderRespon');
    const btn = document.getElementById('btnToggleCameraRespon');
    const btnText = document.getElementById('btnToggleCameraResponText');

    if (!readerEl) return;

    try {
      if (btnText) btnText.innerText = 'Menyalakan Kamera...';
      if (btn) btn.disabled = true;

      // LANGKAH KRUSIAL 1: Tampilkan wadah SEBELUM engine scanner mulai mengukur dimensi video
      if (placeholderEl) placeholderEl.classList.add('hidden');
      readerEl.classList.remove('hidden');
      readerEl.style.display = 'flex';

      // Bersihkan instans kamera lama bila sebelumnya masih tersisa
      if (responCameraScanner) {
        try {
          await responCameraScanner.stop();
          await responCameraScanner.clear();
        } catch (e) {}
        responCameraScanner = null;
      }
      readerEl.innerHTML = '';

      responCameraScanner = new Html5Qrcode('qr-reader-respon');

      // LANGKAH KRUSIAL 2: Gunakan fungsi qrbox dinamis agar proporsional di HP maupun Laptop
      const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
        const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
        const qrboxSize = Math.max(160, Math.floor(minEdge * 0.72));
        return {
          width: qrboxSize,
          height: qrboxSize
        };
      };

      const config = {
        fps: 15,
        qrbox: qrboxFunction,
        aspectRatio: 1.0
      };

      // LANGKAH KRUSIAL 3: Enumerasi perangkat kamera fisik (deteksi lensa belakang di smartphone)
      let cameraConfig = { facingMode: "environment" };
      try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length > 0) {
          const backCam = devices.find(function(d) {
            return /back|rear|environment|belakang|main/i.test(d.label);
          });
          if (backCam) {
            cameraConfig = backCam.id;
          } else if (devices.length > 1) {
            // Pada smartphone kamera belakang biasanya terletak di urutan akhir
            cameraConfig = devices[devices.length - 1].id;
          } else {
            cameraConfig = devices[0].id;
          }
        }
      } catch (camErr) {
        console.warn('Enum kamera opsional:', camErr);
      }

      await responCameraScanner.start(
        cameraConfig,
        config,
        function onScanSuccess(decodedText) {
          playScannerBeep();
          stopCameraScannerRespon();
          lookupCode(decodedText, 'scanResultContentRespon', 'scanResultPlaceholderRespon');
          showToast('Kode QR berhasil dipindai!', 'success');
        },
        function onScanFailure() {}
      );

      isResponCameraRunning = true;

      if (btn) {
        btn.disabled = false;
        btn.classList.remove('dynamic-theme-btn');
        btn.classList.add('bg-slate-700', 'hover:bg-slate-800');
      }
      if (btnText) btnText.innerText = 'Matikan Kamera';

    } catch (err) {
      console.error('Kamera error:', err);
      await stopCameraScannerRespon();

      let msg = 'Gagal menampilkan video kamera. ';
      if (err && (err.name === 'NotAllowedError' || String(err).includes('Permission'))) {
        msg += 'Izin akses kamera ditolak oleh browser. Pastikan izin kamera aktif atau gunakan opsi "Pindai dari Foto / Galeri".';
      } else {
        msg += 'Pastikan izin kamera aktif, atau gunakan tombol "Pilih Foto dari Galeri".';
      }
      showToast(msg, 'error');
    }
  }

  async function stopCameraScannerRespon() {
    const readerEl = document.getElementById('qr-reader-respon');
    const placeholderEl = document.getElementById('qrStandbyPlaceholderRespon');
    const btn = document.getElementById('btnToggleCameraRespon');
    const btnText = document.getElementById('btnToggleCameraResponText');

    if (responCameraScanner && isResponCameraRunning) {
      try {
        await responCameraScanner.stop();
        await responCameraScanner.clear();
      } catch (err) {
        console.warn('Error stopping scanner:', err);
      }
    }
    responCameraScanner = null;
    isResponCameraRunning = false;

    if (readerEl) {
      readerEl.classList.add('hidden');
      readerEl.style.display = 'none';
      readerEl.innerHTML = '';
    }
    if (placeholderEl) placeholderEl.classList.remove('hidden');

    if (btn) {
      btn.disabled = false;
      btn.classList.add('dynamic-theme-btn');
      btn.classList.remove('bg-slate-700', 'hover:bg-slate-800');
    }
    if (btnText) btnText.innerText = 'Nyalakan Kamera';
  }

  async function scanFromImageFile(fileInput) {
    if (!fileInput.files || fileInput.files.length === 0) return;
    const imageFile = fileInput.files[0];

    showToast('Memproses jepretan kamera / gambar...', 'info');

    try {
      const isRespon = !document.getElementById('view-respon')?.classList.contains('hidden');
      const targetReader = isRespon ? 'qr-reader-respon' : 'qr-reader';

      const scannerEngine = new Html5Qrcode(targetReader);
      const decodedText = await scannerEngine.scanFile(imageFile, true);
      
      playScannerBeep();
      lookupCode(decodedText);
      showToast('QR Code berhasil diidentifikasi!', 'success');
    } catch (err) {
      showToast('Kode QR tidak terdeteksi. Pastikan foto tegak, fokus, dan pencahayaan cukup.', 'error');
    } finally {
      fileInput.value = '';
    }
  }

  function handleReportImagePreview(input) {
    if (!input.files || input.files.length === 0) return;
    const file = input.files[0];

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 1000;

        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);

        const previewWrapper = document.getElementById('maintImagePreviewWrapper');
        const previewImg = document.getElementById('maintImagePreviewImg');
        const uploadBox = document.getElementById('maintImageUploadBox');
        const base64Input = document.getElementById('maintFormImageBase64');

        if (previewImg) previewImg.src = compressedBase64;
        if (previewWrapper) previewWrapper.classList.remove('hidden');
        if (uploadBox) uploadBox.classList.add('hidden');
        if (base64Input) base64Input.value = compressedBase64;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearReportImagePreview() {
    const fileInput = document.getElementById('maintFormImageFile');
    const previewWrapper = document.getElementById('maintImagePreviewWrapper');
    const previewImg = document.getElementById('maintImagePreviewImg');
    const uploadBox = document.getElementById('maintImageUploadBox');
    const base64Input = document.getElementById('maintFormImageBase64');

    if (fileInput) fileInput.value = '';
    if (previewImg) previewImg.src = '';
    if (previewWrapper) previewWrapper.classList.add('hidden');
    if (uploadBox) uploadBox.classList.remove('hidden');
    if (base64Input) base64Input.value = '';
  }

    if (!input.files || input.files.length === 0) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 1000;

        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);

        const previewWrapper = document.getElementById('resolveImagePreviewWrapper');
        const previewImg = document.getElementById('resolveImagePreviewImg');
        const uploadBox = document.getElementById('resolveImageUploadBox');
        const base64Input = document.getElementById('resolveFormImageBase64');

        if (previewImg) previewImg.src = compressedBase64;
        if (previewWrapper) previewWrapper.classList.remove('hidden');
        if (uploadBox) uploadBox.classList.add('hidden');
        if (base64Input) base64Input.value = compressedBase64;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function applySystemTheme(themeId, fontId) {
    const theme = THEME_PRESETS.find(function(t) { return t.id === themeId; }) || THEME_PRESETS[0];
    const font = FONT_PRESETS.find(function(f) { return f.id === fontId; }) || FONT_PRESETS[0];

    const root = document.documentElement;
    root.style.setProperty('--app-font-family', font.family);
    root.style.setProperty('--theme-primary', theme.primary);
    root.style.setProperty('--theme-primary-hover', theme.primaryHover);
    root.style.setProperty('--theme-primary-light', theme.primaryLight);
    root.style.setProperty('--theme-primary-border', theme.primaryBorder);
    root.style.setProperty('--theme-gradient-start', theme.gradStart);
    root.style.setProperty('--theme-gradient-mid', theme.gradMid);
    root.style.setProperty('--theme-gradient-end', theme.gradEnd);
    root.style.setProperty('--theme-bg', theme.bgColor);

    document.body.style.fontFamily = font.family;
    document.body.style.backgroundColor = theme.bgColor;

    DB.settings.selectedTheme = theme.id;
    DB.settings.selectedFont = font.id;
    DB.save();

    renderThemePresets();
    renderFontPresets();
  }

  function showToast(message, type) {
    type = type || 'success';
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    
    const isSuccess = type === 'success';
    const isError = type === 'error';
    const bg = isSuccess ? 'bg-white border-emerald-500 text-emerald-800' : isError ? 'bg-white border-rose-500 text-rose-800' : 'bg-white border-slate-500 text-slate-800';
    const icon = isSuccess ? 'fa-circle-check text-emerald-600' : isError ? 'fa-circle-xmark text-rose-600' : 'fa-circle-info dynamic-theme-text';

    toast.className = 'p-3.5 rounded-2xl shadow-soft border-l-4 ' + bg + ' flex items-center space-x-3 pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0 text-xs font-semibold';
    toast.innerHTML = '<i class="fa-solid ' + icon + ' text-base shrink-0"></i>' +
      '<span class="flex-1">' + message + '</span>' +
      '<button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 ml-2">' +
        '<i class="fa-solid fa-xmark"></i>' +
      '</button>';

    container.appendChild(toast);
    setTimeout(function() {
      toast.classList.remove('translate-y-2', 'opacity-0');
    }, 50);

    setTimeout(function() {
      toast.classList.add('opacity-0', 'translate-x-full');
      setTimeout(function() { toast.remove(); }, 300);
    }, 4000);
  }

  function handleLogin() {
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value.trim();

    const foundUser = DB.users.find(function(user) {
      return user.username.toLowerCase() === u.toLowerCase() || user.userId === u;
    });

    if (!foundUser) {
      showToast('Username atau akun tidak ditemukan!', 'error');
      return;
    }

    if (foundUser.password !== p) {
      showToast('Password yang dimasukkan salah!', 'error');
      return;
    }

    if (foundUser.status === 'Nonaktif') {
      showToast('Akun Anda dinonaktifkan oleh Administrator.', 'error');
      return;
    }

    DB.currentUser = foundUser;
    sessionStorage.setItem('DS_AUTH_USER', JSON.stringify(foundUser));
    DB.logActivity(foundUser.nama + ' berhasil masuk', 'fa-right-to-bracket dynamic-theme-text');
    
    initAppSession();
    showToast('Selamat datang, ' + foundUser.nama + '!', 'success');
  }

    if (isResponCameraRunning) {

    DB.currentUser = null;
    sessionStorage.removeItem('DS_AUTH_USER');

    const uInput = document.getElementById('loginUsername');

    const backdrop = document.getElementById('mobileDrawerBackdrop');
    if (!drawer || !backdrop) return;
    const isOpen = !drawer.classList.contains('-translate-x-full');

  function navigateTo(viewId) {
    closeMobileSidebar();

    if (viewId !== 'respon' && isResponCameraRunning) {
      stopCameraScannerRespon();
    }

    const role = DB.currentUser?.role;
    const isGuest = role === 'Guest' || role === 'Guest/Tamu' || role === 'Tamu';

    if (isGuest && viewId !== 'respon') {
      showToast('Akses dibatasi. Akun Guest/Tamu hanya memiliki akses ke menu Pelayanan!', 'error');
      viewId = 'respon';
    }

    document.querySelectorAll('.app-view').forEach(function(v) { v.classList.add('hidden'); });
    const target = document.getElementById('view-' + viewId);
    if (target) target.classList.remove('hidden');

    document.querySelectorAll('.nav-btn').forEach(function(btn) {
      const icon = btn.querySelector('i');
      if (btn.getAttribute('data-nav') === viewId) {
        btn.className = 'nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-bold dynamic-theme-btn text-white shadow-sm transition';
        if (icon) icon.className = icon.className.replace('text-slate-400', 'text-white').replace('text-amber-500', 'text-white');
      } else {
        btn.className = 'nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-cream-100 transition';
        if (icon) {
          if (btn.getAttribute('data-nav') === 'respon') {
            icon.className = 'fa-solid fa-bolt w-5 text-center text-amber-500';
          } else {
            icon.className = icon.className.replace('text-white', 'text-slate-400');
          }
        }
      }
    });

    document.querySelectorAll('[data-mob-nav]').forEach(function(btn) {
      if (btn.getAttribute('data-mob-nav') === viewId) {
        btn.classList.add('dynamic-theme-text', 'font-bold');
        btn.classList.remove('text-slate-500');
      } else {
        btn.classList.remove('dynamic-theme-text', 'font-bold');
        btn.classList.add('text-slate-500');
      }
    });

    if (viewId === 'dashboard') refreshDashboard();
    if (viewId === 'assets') renderAssetsTable();
    if (viewId === 'maintenance') renderMaintenanceView();
    if (viewId === 'procurements') renderProcurementAndDisposal();
    if (viewId === 'buildings') renderBuildingsView();
    if (viewId === 'rooms') renderRoomsView();
    if (viewId === 'cetak-qr') {
      initCetakQRFilters();
      muatDataCetakQR();
    }
    if (viewId === 'users') {
      if (DB.currentUser?.role !== 'Admin') {
        showToast('Menu Akun Pengguna hanya dapat diakses oleh Administrator!', 'error');
        navigateTo(isGuest ? 'respon' : 'dashboard');
        return;
      }
      renderUsersView();
    }
    if (viewId === 'settings') {
      if (DB.currentUser?.role !== 'Admin') {
        showToast('Menu Pengaturan Sistem hanya dapat diakses oleh Administrator!', 'error');
        navigateTo(isGuest ? 'respon' : 'dashboard');
        return;
      }
      loadSettingsForm();
    }
  }

    const total = activeAssets.length;
    const baik = activeAssets.filter(function(a) { return a.kondisi === 'Baik'; }).length;
    const rusakRingan = activeAssets.filter(function(a) { return a.kondisi === 'Rusak Ringan'; }).length;
    const rusakBerat = activeAssets.filter(function(a) { return a.kondisi === 'Rusak Berat'; }).length;

    document.getElementById('statRusakBerat').innerText = rusakBerat;

  function renderAssetsTable() {
    const q = (document.getElementById('assetSearchInput')?.value || '').toLowerCase();
    const kat = document.getElementById('filterAssetKategori')?.value || '';
    const kon = document.getElementById('filterAssetKondisi')?.value || '';
    const gdg = document.getElementById('filterAssetGedung')?.value || '';

    const filtered = DB.assets.filter(function(a) {
      if (a.statusAset !== 'Aktif') return false;
      const matchQ = (a.kodeBarang + ' ' + a.namaBarang + ' ' + (a.spesifikasi || '')).toLowerCase().includes(q);
      const matchKat = !kat || a.kategori === kat;
      const matchKon = !kon || a.kondisi === kon;
      const matchGdg = !gdg || a.gedungId === gdg;
      return matchQ && matchKat && matchKon && matchGdg;
    });

    const tbody = document.getElementById('assetsTableBody');
    const mobileCards = document.getElementById('assetsMobileCardContainer');
    const emptyState = document.getElementById('assetsEmptyState');

    if (filtered.length === 0) {
      if (tbody) tbody.innerHTML = '';
      if (mobileCards) mobileCards.innerHTML = '';
      if (emptyState) emptyState.classList.remove('hidden');
      return;
    }
    if (emptyState) emptyState.classList.add('hidden');

    if (tbody) {

  function populateRoomDropdownForAsset(selectedGedungId, defaultRoomId) {
    const select = document.getElementById('assetFormRuang');

    if (rooms.length === 0) {

      select.innerHTML = rooms.map(function(r) {

        return '<option value="' + r.ruangId + '" ' + isSel + '>' + r.namaRuang + ' (' + r.kodeRuang + ')</option>';

  function openAssetModal(assetId) {
    const form = document.getElementById('formAsset');
    form.reset();

    gdgSelect.innerHTML = DB.buildings.map(function(b) {

      document.getElementById('assetFormId').value = a.assetId;

      document.getElementById('assetFormNama').value = a.namaBarang;

      document.getElementById('modalAssetTitle').innerText = 'Tambah Data Aset Baru';

  function saveAsset() {
    const assetId = document.getElementById('assetFormId').value;
    const kode = document.getElementById('assetFormKode').value.trim().toUpperCase();
    const nama = document.getElementById('assetFormNama').value.trim();

    if (!kode || !nama) {
      showToast('Harap lengkapi kode dan nama aset!', 'error');
      return;
    }

    const isEdit = !!assetId;
    const assetData = {
      assetId: assetId || ('AST-' + Date.now()),
      kodeBarang: kode,
      namaBarang: nama,
      kategori: document.getElementById('assetFormKategori').value,
      spesifikasi: document.getElementById('assetFormSpesifikasi').value.trim(),
      tahunPerolehan: Number(document.getElementById('assetFormTahun').value),
      sumberDana: document.getElementById('assetFormSumberDana').value,
      hargaPerolehan: Number(document.getElementById('assetFormHarga').value),
      jumlah: Number(document.getElementById('assetFormJumlah').value),
      satuan: document.getElementById('assetFormSatuan').value.trim() || 'Unit',
      kondisi: document.getElementById('assetFormKondisi').value,
      gedungId: document.getElementById('assetFormGedung').value,
      ruangId: document.getElementById('assetFormRuang').value,
      penanggungJawab: document.getElementById('assetFormPJ').value.trim(),
      statusAset: 'Aktif',
      keterangan: document.getElementById('assetFormKet').value.trim()
    };

    if (isEdit) {
      const idx = DB.assets.findIndex(function(a) { return a.assetId === assetId; });
      if (idx !== -1) DB.assets[idx] = assetData;
      DB.logActivity('Aset ' + nama + ' diperbarui', 'fa-pen-to-square text-amber-600');
      showToast('Data aset berhasil diperbarui!');
    } else {
      DB.assets.unshift(assetData);
      DB.logActivity('Aset baru ' + nama + ' ditambahkan', 'fa-plus text-emerald-600');
      showToast('Aset baru berhasil disimpan!');
    }

    DB.save();
    closeModal('modalAsset');
    renderAssetsTable();
    refreshDashboard();

    callBackendApi('saveAsset', assetData);
  }

  function deleteAssetConfirm(assetId) {
    const a = DB.assets.find(function(item) { return item.assetId === assetId; });
    if (!a) return;

    promptConfirmation('Hapus Data Aset', 'Apakah Anda yakin ingin menghapus data aset "' + a.namaBarang + '" (' + a.kodeBarang + ')?', function() {
      DB.assets = DB.assets.filter(function(item) { return item.assetId !== assetId; });
      DB.save();
      DB.logActivity('Aset ' + a.namaBarang + ' dihapus', 'fa-trash text-rose-600');
      showToast('Aset telah dihapus.');
      renderAssetsTable();
      refreshDashboard();

      callBackendApi('deleteAsset', { assetId: assetId });
    });
  }

  function exportAssetsCSV() {
    if (DB.assets.length === 0) {
      showToast('Tidak ada data aset untuk diekspor!', 'error');
      return;
    }
    const headers = ['Kode Barang', 'Nama Barang', 'Kategori', 'Kondisi', 'Jumlah', 'Satuan', 'Harga Perolehan', 'Tahun', 'Sumber Dana', 'Gedung', 'Ruang', 'Penanggung Jawab', 'Status'];
    const rows = DB.assets.map(function(a) {
      const bg = DB.buildings.find(function(b) { return b.gedungId === a.gedungId; })?.namaGedung || '';
      const rm = DB.rooms.find(function(r) { return r.ruangId === a.ruangId; })?.namaRuang || '';
      return [
        '"' + a.kodeBarang + '"',
        '"' + a.namaBarang + '"',
        '"' + a.kategori + '"',
        '"' + a.kondisi + '"',
        a.jumlah,
        '"' + a.satuan + '"',
        a.hargaPerolehan,
        a.tahunPerolehan,
        '"' + a.sumberDana + '"',
        '"' + bg + '"',
        '"' + rm + '"',
        '"' + (a.penanggungJawab || '') + '"',
        '"' + a.statusAset + '"'
      ].join(',');
    });

    const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', 'Data_Aset_Sarpras_' + new Date().toISOString().slice(0, 10) + '.csv');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('Export CSV berhasil diunduh!');
  }

    document.getElementById('countMaintPending').innerText = pending.length;
    document.getElementById('countMaintCompleted').innerText = completed.length;

    const items = currentMaintenanceFilter === 'pending' ? pending : completed;

  function submitMaintenanceReport() {
    const targetId = document.getElementById('maintFormAssetId').value;
    const tanggal = document.getElementById('maintFormTanggal').value;
    const kondisiBaru = document.getElementById('maintFormKondisiBaru')?.value || 'Rusak Berat';
    const kerusakan = document.getElementById('maintFormKerusakan').value.trim();
    const imageBase64 = document.getElementById('maintFormImageBase64')?.value || '';
    const pelapor = document.getElementById('maintFormPelapor')?.value.trim() || (DB.currentUser?.nama || 'Warga Sekolah / Tamu');

    if (!targetId || !kerusakan) {
      showToast('Pilih objek kerusakan dan jelaskan kendala!', 'error');
      return;
    }

    const btnSubmit = document.getElementById('btnSubmitMaintReport');
    const btnText = document.getElementById('btnSubmitMaintText');
    if (btnSubmit) btnSubmit.disabled = true;
    if (btnText) btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Mengirim...';

    let kodeObj = targetId;
    let namaObj = 'Entitas Sarpras';
    let lokasiStr = 'Area Sekolah';

    const ast = DB.assets.find(function(a) { return a.assetId === targetId || a.kodeBarang === targetId; });
    const rm = DB.rooms.find(function(r) { return r.ruangId === targetId || r.kodeRuang === targetId; });
    const bg = DB.buildings.find(function(b) { return b.gedungId === targetId || b.kodeGedung === targetId; });

    if (ast) {
      kodeObj = ast.kodeBarang;
      namaObj = ast.namaBarang;
      ast.kondisi = kondisiBaru;
      const bParent = DB.buildings.find(function(b) { return b.gedungId === ast.gedungId; });
      const rParent = DB.rooms.find(function(r) { return r.ruangId === ast.ruangId; });
      lokasiStr = (bParent ? bParent.namaGedung : '-') + ' / ' + (rParent ? rParent.namaRuang : '-');
    } else if (rm) {
      kodeObj = rm.kodeRuang;
      namaObj = 'Ruang: ' + rm.namaRuang;
      rm.kondisi = kondisiBaru;
      const bParent = DB.buildings.find(function(b) { return b.gedungId === rm.gedungId; });
      lokasiStr = (bParent ? bParent.namaGedung : '-') + ' • Lantai ' + (rm.lantai || 1);
    } else if (bg) {
      kodeObj = bg.kodeGedung;
      namaObj = 'Gedung: ' + bg.namaGedung;
      bg.kondisi = kondisiBaru;
      lokasiStr = bg.lokasi || 'Area Kampus Sekolah';
    }

    const payload = {
      assetId: targetId,
      kodeBarang: kodeObj,
      namaBarang: namaObj,
      lokasi: lokasiStr,
      tanggalLaporan: tanggal,
      kondisiBaru: kondisiBaru,
      detailKerusakan: kerusakan,
      imageBase64: imageBase64,
      pelapor: pelapor
    };

    callBackendApi('saveQuickReportWithImage', payload, function(res) {
      if (btnSubmit) btnSubmit.disabled = false;
      if (btnText) btnText.innerText = 'Kirim Laporan';

      if (res && res.success) {
        showToast(res.message || 'Laporan berhasil dikirim dan tersimpan di database!', 'success');

        DB.maintenance.unshift({
          maintenanceId: res.laporanId || ('MNT-' + Date.now()),
          assetId: targetId,
          tanggalLaporan: tanggal,
          kerusakan: (DB.currentUser?.role === 'Guest' ? '[PELAYANAN] ' : '') + kerusakan + (res.fotoUrl ? ' (Foto terlampir)' : ''),
          status: 'Belum Diperbaiki',
          tanggalSelesai: '',
          kondisiSetelah: '',
          catatanPerbaikan: '',
          fotoPerbaikanUrl: '',
          updatedBy: pelapor
        });
        DB.save();
        DB.logActivity('Laporan kerusakan ' + namaObj + ' masuk', 'fa-triangle-exclamation text-rose-600');

        closeModal('modalReportMaint');
        clearReportImagePreview();

        renderMaintenanceView();
        refreshDashboard();
      } else {
        showToast(res?.message || 'Gagal mengirim laporan.', 'error');
      }
    }, function(err) {
      if (btnSubmit) btnSubmit.disabled = false;
      if (btnText) btnText.innerText = 'Kirim Laporan';
      showToast('Koneksi server gagal: ' + err.message, 'error');
    });
  }

  function submitResolveMaintenance() {
    const maintId = document.getElementById('resolveMaintId').value;
    const assetId = document.getElementById('resolveAssetId').value;
    const tgl = document.getElementById('resolveTanggalSelesai').value;
    const kondisi = document.getElementById('resolveKondisiSetelah').value;
    const catatan = document.getElementById('resolveCatatan').value.trim();
    const fotoBase64 = document.getElementById('resolveFormImageBase64')?.value || '';

    if (!catatan) {
      showToast('Harap masukkan catatan hasil perbaikan!', 'error');
      return;
    }

    const btnSubmit = document.getElementById('btnSubmitResolveMaint');
    const btnText = document.getElementById('btnSubmitResolveText');
    if (btnSubmit) btnSubmit.disabled = true;
    if (btnText) btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Menyimpan...';

    const m = DB.maintenance.find(function(item) { return item.maintenanceId === maintId; });
    if (m) {
      m.status = 'Selesai';
      m.tanggalSelesai = tgl;
      m.kondisiSetelah = kondisi;
      m.catatanPerbaikan = catatan;
      m.updatedBy = DB.currentUser?.nama || 'Admin Sarpras';
    }

    const ast = DB.assets.find(function(a) { return a.assetId === assetId; });
    const rm = DB.rooms.find(function(r) { return r.ruangId === assetId; });
    const bg = DB.buildings.find(function(b) { return b.gedungId === assetId; });
    if (ast) ast.kondisi = kondisi;
    if (rm) rm.kondisi = kondisi;
    if (bg) bg.kondisi = kondisi;

    const maintPayload = {
      maintenanceId: maintId,
      assetId: assetId,
      status: 'Selesai',
      tanggalSelesai: tgl,
      kondisiSetelah: kondisi,
      catatanPerbaikan: catatan,
      fotoPerbaikanBase64: fotoBase64,
      updatedBy: DB.currentUser?.nama || 'Admin Sarpras'
    };

    callBackendApi('saveMaintenance', maintPayload, function(res) {
      if (btnSubmit) btnSubmit.disabled = false;
      if (btnText) btnText.innerText = 'Simpan Status Selesai';

      if (res && res.success) {
        if (m && res.fotoPerbaikanUrl) {
          m.fotoPerbaikanUrl = res.fotoPerbaikanUrl;
        }
        DB.save();
        DB.logActivity('Servis ' + (ast?.namaBarang || rm?.namaRuang || bg?.namaGedung || 'Sarpras') + ' diselesaikan', 'fa-circle-check text-emerald-600');
        closeModal('modalResolveMaint');
        clearResolveImagePreview();
        showToast('Status perbaikan dan foto bukti berhasil disimpan!');
        renderMaintenanceView();
        refreshDashboard();
      } else {
        showToast(res?.message || 'Gagal menyimpan status selesai.', 'error');
      }
    }, function(err) {
      if (btnSubmit) btnSubmit.disabled = false;
      if (btnText) btnText.innerText = 'Simpan Status Selesai';
      showToast('Koneksi server gagal: ' + err.message, 'error');
    });
  }

  function lookupCode(rawCode, customContentId, customPlaceholderId) {
    const code = String(rawCode || '').trim().toUpperCase();
    if (!code) return;

    const isRespon = !document.getElementById('view-respon')?.classList.contains('hidden');
    const contentId = customContentId || (isRespon ? 'scanResultContentRespon' : 'scanResultContent');
    const placeholderId = customPlaceholderId || (isRespon ? 'scanResultPlaceholderRespon' : 'scanResultPlaceholder');

    const placeholder = document.getElementById(placeholderId);
    const content = document.getElementById(contentId);
    if (placeholder) placeholder.classList.add('hidden');
    if (content) {
      content.classList.remove('hidden');
      content.innerHTML = 
        '<div class="p-8 text-center text-slate-500 text-xs">' +
          '<i class="fa-solid fa-spinner fa-spin text-2xl dynamic-theme-text mb-2 block"></i>' +
          '<span>Mengidentifikasi data entitas "' + code + '"...</span>' +
        '</div>';
    }

    const bg = DB.buildings.find(function(b) {
      return (b.kodeGedung && b.kodeGedung.toUpperCase() === code) || 
             (b.gedungId && b.gedungId.toUpperCase() === code) ||
             (b.namaGedung && b.namaGedung.trim().toUpperCase() === code);
    });

    if (bg) {
      playScannerBeep();
      renderGedungDetailScan(bg, false, contentId);
      return;
    }

    const rm = DB.rooms.find(function(r) {
      return (r.kodeRuang && r.kodeRuang.toUpperCase() === code) || 
             (r.ruangId && r.ruangId.toUpperCase() === code) ||
             (r.namaRuang && r.namaRuang.trim().toUpperCase() === code);
    });

    if (rm) {
      playScannerBeep();
      renderRuangDetailScan(rm, false, contentId);
      return;
    }

    const ast = DB.assets.find(function(a) {

  function showQRCode(id, type) {
    let code = '';
    let title = '';
    let subtitle = '';

    if (type === 'asset') {
      const a = DB.assets.find(function(item) { return item.assetId === id || item.kodeBarang === id; });
      if (!a) return;
      code = a.kodeBarang;
      title = a.namaBarang;
      const bg = DB.buildings.find(function(b) { return b.gedungId === a.gedungId; })?.namaGedung || '';
      const rm = DB.rooms.find(function(r) { return r.ruangId === a.ruangId; })?.namaRuang || '';
      subtitle = bg + ' • ' + rm;
    } else if (type === 'room') {
      const r = DB.rooms.find(function(item) { return item.ruangId === id || item.kodeRuang === id; });
      if (!r) return;
      code = r.kodeRuang;
      title = r.namaRuang;
      const bg = DB.buildings.find(function(b) { return b.gedungId === r.gedungId; })?.namaGedung || '';
      subtitle = bg + ' • Lantai ' + r.lantai;
    } else if (type === 'building') {
      const b = DB.buildings.find(function(item) { return item.gedungId === id || item.kodeGedung === id; });
      if (!b) return;
      code = b.kodeGedung;
      title = b.namaGedung;
      subtitle = b.jenisBangunan + ' • ' + b.lokasi;
    }

    document.getElementById('qrPrintSchool').innerText = DB.settings.schoolName || 'DIGITAS SARPRAS';
    document.getElementById('qrPrintCode').innerText = code;
    document.getElementById('qrPrintTitle').innerText = title;
    document.getElementById('qrPrintSubtitle').innerText = subtitle;

    const target = document.getElementById('qrCodeTarget');
    target.innerHTML = '';
    new QRCode(target, {
      text: code,
      width: 140,
      height: 140,
      colorDark: "#111827",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    openModal('modalQR');
  }

  function initCetakQRFilters() {
    const selKat = document.getElementById('filterCetakKategori');
    const selGdg = document.getElementById('filterCetakGedung');
    const selRng = document.getElementById('filterCetakRuang');

    if (selKat) {
      const kategoriMap = {};
      DB.assets.forEach(function(a) {
        if (a.kategori) kategoriMap[a.kategori.trim()] = true;
      });
      selKat.innerHTML = '<option value="">-- Semua Kategori --</option>' + 
        Object.keys(kategoriMap).sort().map(function(k) { return '<option value="' + k + '">' + k + '</option>'; }).join('');
    }

    if (selGdg) {
      selGdg.innerHTML = '<option value="">-- Semua Gedung --</option>' + 
        DB.buildings.map(function(b) { return '<option value="' + b.gedungId + '">' + b.namaGedung + ' (' + b.kodeGedung + ')</option>'; }).join('');
    }

    if (selRng) {
      populateCetakRuangDropdown('');
    }
  }

  function populateCetakRuangDropdown(filterGedungId) {
    const selRng = document.getElementById('filterCetakRuang');
    if (!selRng) return;

    let rooms = DB.rooms;
    if (filterGedungId) {
      rooms = DB.rooms.filter(function(r) { return String(r.gedungId).toUpperCase() === String(filterGedungId).toUpperCase(); });
    }

    selRng.innerHTML = '<option value="">-- Semua Ruang --</option>' + 
      rooms.map(function(r) { return '<option value="' + r.ruangId + '">' + r.namaRuang + ' (' + r.kodeRuang + ')</option>'; }).join('');
  }

  function handleCetakTipeChange() {
    const tipe = document.getElementById('filterCetakTipe').value;
    const wrapKat = document.getElementById('wrapFilterCetakKategori');
    const wrapGdg = document.getElementById('wrapFilterCetakGedung');
    const wrapRng = document.getElementById('wrapFilterCetakRuang');

    if (tipe === 'aset') {
      if (wrapKat) wrapKat.style.display = 'block';
      if (wrapGdg) wrapGdg.style.display = 'block';
      if (wrapRng) wrapRng.style.display = 'block';
    } else if (tipe === 'ruang') {
      if (wrapKat) wrapKat.style.display = 'none';
      if (wrapGdg) wrapGdg.style.display = 'block';
      if (wrapRng) wrapRng.style.display = 'block';
    } else if (tipe === 'gedung') {
      if (wrapKat) wrapKat.style.display = 'none';
      if (wrapGdg) wrapGdg.style.display = 'block';
      if (wrapRng) wrapRng.style.display = 'none';
    }

    muatDataCetakQR();
  }

  function handleCetakGedungChange() {
    const gdgId = document.getElementById('filterCetakGedung').value;
    populateCetakRuangDropdown(gdgId);
    muatDataCetakQR();
  }

  function handleCetakPaperChange(size) {
    const area = document.getElementById('printableBatchArea');
    if (!area) return;

    if (size === 'folio') {

      area.style.minHeight = '330mm';

  function muatDataCetakQR() {
    const tipe = document.getElementById('filterCetakTipe')?.value || 'aset';
    const kat = (document.getElementById('filterCetakKategori')?.value || '').toLowerCase().trim();
    const gdg = (document.getElementById('filterCetakGedung')?.value || '').toLowerCase().trim();
    const rng = (document.getElementById('filterCetakRuang')?.value || '').toLowerCase().trim();

    const grid = document.getElementById('printSheetItemsGrid');
    const countBadge = document.getElementById('labelCetakCount');
    if (!grid) return;

    grid.innerHTML = 
      '<div class="col-span-full py-16 text-center text-slate-400 text-xs">' +
        '<i class="fa-solid fa-spinner fa-spin text-2xl dynamic-theme-text mb-2 block"></i>' +
        '<span>Memuat data stiker QR-Code...</span>' +
      '</div>';

    let items = [];

    if (tipe === 'aset') {
      items = DB.assets.filter(function(a) {
        if (a.statusAset === 'Dimusnahkan') return false;
        const matchKat = !kat || (a.kategori || '').toLowerCase().trim() === kat;
        const matchGdg = !gdg || String(a.gedungId).toLowerCase().trim() === gdg;
        const matchRng = !rng || String(a.ruangId).toLowerCase().trim() === rng;
        return matchKat && matchGdg && matchRng;
      }).map(function(a) {
        const pGdg = DB.buildings.find(function(b) { return String(b.gedungId).toLowerCase() === String(a.gedungId).toLowerCase(); });
        const pRng = DB.rooms.find(function(r) { return String(r.ruangId).toLowerCase() === String(a.ruangId).toLowerCase(); });
        return {
          id: a.assetId,
          kode: a.kodeBarang,
          nama: a.namaBarang,
          sub: a.kategori + (a.spesifikasi ? ' • ' + a.spesifikasi : ''),
          kondisi: a.kondisi || 'Baik',
          lokasi: (pGdg ? pGdg.namaGedung : '-') + ' / ' + (pRng ? pRng.namaRuang : '-'),
          qrValue: a.kodeBarang,
          tipeLabel: 'ASET SARPRAS'
        };
      });
    } else if (tipe === 'ruang') {
      items = DB.rooms.filter(function(r) {
        const matchGdg = !gdg || String(r.gedungId).toLowerCase().trim() === gdg;
        const matchRng = !rng || String(r.ruangId).toLowerCase().trim() === rng;
        return matchGdg && matchRng;
      }).map(function(r) {
        const pGdg = DB.buildings.find(function(b) { return String(b.gedungId).toLowerCase() === String(r.gedungId).toLowerCase(); });
        return {
          id: r.ruangId,
          kode: r.kodeRuang,
          nama: r.namaRuang,
          sub: (r.jenisRuang || 'Ruang') + ' • Lantai ' + (r.lantai || 1) + ' (Kapasitas: ' + (r.kapasitas || 0) + ' Org)',
          kondisi: r.kondisi || 'Baik',
          lokasi: pGdg ? pGdg.namaGedung : '-',
          qrValue: r.kodeRuang,
          tipeLabel: 'LABEL RUANGAN'
        };
      });
    } else if (tipe === 'gedung') {
      items = DB.buildings.filter(function(b) {
        return !gdg || String(b.gedungId).toLowerCase().trim() === gdg;
      }).map(function(b) {
        return {
          id: b.gedungId,
          kode: b.kodeGedung,
          nama: b.namaGedung,
          sub: (b.jenisBangunan || 'Akademik') + ' • ' + (b.jumlahLantai || 1) + ' Lantai (' + (b.luas || 0) + ' m²)',
          kondisi: b.kondisi || 'Baik',
          lokasi: b.lokasi || 'Kampus Sekolah',
          qrValue: b.kodeGedung,
          tipeLabel: 'LABEL BANGUNAN'
        };
      });
    }

    if (countBadge) countBadge.innerText = items.length;

    if (items.length === 0) {
      grid.innerHTML = 
        '<div class="col-span-full py-16 text-center text-slate-400 text-xs">' +
          '<i class="fa-solid fa-box-open text-3xl text-slate-300 mb-2 block"></i>' +
          '<p class="font-bold text-slate-700">Tidak ada data yang sesuai filter</p>' +
          '<p class="text-[11px] text-slate-400 mt-1">Coba sesuaikan pilihan filter kategori, gedung, atau ruang Anda.</p>' +
        '</div>';
      return;
    }

    grid.innerHTML = '';
    const schoolName = DB.settings.schoolName || 'DIGITAS SARPRAS';

    items.forEach(function(item, idx) {
      const card = document.createElement('div');
      card.className = 'border-2 border-dashed border-slate-300 rounded-xl p-3 bg-white text-slate-800 flex flex-col justify-between break-inside-avoid shadow-xs';
      
      const qrBoxId = 'qr_batch_' + idx;
      card.innerHTML = 
        '<div class="border-b border-slate-200 pb-1.5 mb-1.5 text-center">' +
          '<p class="text-[9px] font-black uppercase tracking-wider text-slate-900 line-clamp-1">' + schoolName + '</p>' +
          '<span class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">' + item.tipeLabel + '</span>' +
        '</div>' +
        '<div class="flex items-center justify-center my-1">' +
          '<div id="' + qrBoxId + '" class="p-1 bg-white border border-slate-200 rounded-lg flex items-center justify-center"></div>' +
        '</div>' +
        '<div class="text-center pt-1 border-t border-slate-100 mt-1 space-y-0.5">' +
          '<p class="text-[11px] font-mono font-extrabold text-slate-900 tracking-wider">' + item.kode + '</p>' +
          '<p class="text-[10px] font-bold text-slate-800 line-clamp-1 leading-tight">' + item.nama + '</p>' +
          '<p class="text-[8.5px] text-slate-500 line-clamp-1 leading-tight">' + item.sub + '</p>' +
          '<p class="text-[8px] font-semibold text-slate-600 line-clamp-1 leading-tight"><i class="fa-solid fa-location-dot mr-1"></i>' + item.lokasi + '</p>' +
        '</div>';

      grid.appendChild(card);

      setTimeout(function() {
        const qrEl = document.getElementById(qrBoxId);
        if (qrEl) {
          new QRCode(qrEl, {
            text: item.qrValue || item.kode,
            width: 80,
            height: 80,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      }, 20);
    });
  }

  function openBuildingModal(buildingId) {
    document.getElementById('formBuilding').reset();
    if (buildingId) {
      const b = DB.buildings.find(function(item) { return item.gedungId === buildingId; });
      if (!b) return;
      document.getElementById('modalBuildingTitle').innerText = 'Edit Data Gedung';
      document.getElementById('buildingFormId').value = b.gedungId;
      document.getElementById('buildingFormKode').value = b.kodeGedung;
      document.getElementById('buildingFormNama').value = b.namaGedung;
      document.getElementById('buildingFormJenis').value = b.jenisBangunan;
      document.getElementById('buildingFormLokasi').value = b.lokasi;
      document.getElementById('buildingFormLuas').value = b.luas;
      document.getElementById('buildingFormTahun').value = b.tahunDibangun;
      document.getElementById('buildingFormLantai').value = b.jumlahLantai;
      document.getElementById('buildingFormKondisi').value = b.kondisi;
    } else {
      document.getElementById('modalBuildingTitle').innerText = 'Tambah Gedung Baru';
      document.getElementById('buildingFormId').value = '';
      document.getElementById('buildingFormKode').value = 'GDG-' + String.fromCharCode(65 + DB.buildings.length);
    }
    openModal('modalBuilding');
  }

  function editBuilding(buildingId) {
    openBuildingModal(buildingId);
  }

  function saveBuilding() {
    const id = document.getElementById('buildingFormId').value;
    const bData = {
      gedungId: id || ('GDG-' + Date.now()),
      kodeGedung: document.getElementById('buildingFormKode').value.trim().toUpperCase(),
      namaGedung: document.getElementById('buildingFormNama').value.trim(),
      jenisBangunan: document.getElementById('buildingFormJenis').value.trim(),
      lokasi: document.getElementById('buildingFormLokasi').value.trim(),
      luas: Number(document.getElementById('buildingFormLuas').value),
      tahunDibangun: Number(document.getElementById('buildingFormTahun').value),
      jumlahLantai: Number(document.getElementById('buildingFormLantai').value),
      kondisi: document.getElementById('buildingFormKondisi').value,
      keterangan: 'Master data gedung sekolah'
    };

    if (id) {
      const idx = DB.buildings.findIndex(function(b) { return b.gedungId === id; });
      if (idx !== -1) DB.buildings[idx] = bData;
    } else {
      DB.buildings.push(bData);
    }

    DB.save();
    DB.logActivity('Data gedung ' + bData.namaGedung + ' diperbarui', 'fa-school text-indigo-600');
    closeModal('modalBuilding');
    showToast('Data gedung berhasil disimpan!');
    renderBuildingsView();
    populateGedungFilterDropdown();
    refreshDashboard();
  }

        '</div>' +
        '<div class="pt-3 border-t border-cream-100 flex justify-end space-x-1.5">' +
          '<button onclick="showQRCode(\'' + r.ruangId + '\', \'room\')" class="px-2.5 py-1 rounded-xl bg-cream-100 hover:bg-cream-200 text-xs font-bold text-slate-700"><i class="fa-solid fa-qrcode mr-1"></i>QR</button>' +
          '<button onclick="editRoom(\'' + r.ruangId + '\')" class="role-action-btn px-2.5 py-1 rounded-xl dynamic-theme-btn text-white text-xs font-bold"><i class="fa-solid fa-pen mr-1"></i>Edit</button>' +
        '</div>' +
      '</div>';
    }).join('');
    applyRolePermissions();
  }

  function openRoomModal(roomId) {
    document.getElementById('formRoom').reset();
    const gdgSelect = document.getElementById('roomFormGedungId');
    gdgSelect.innerHTML = DB.buildings.map(function(b) {
      return '<option value="' + b.gedungId + '">' + b.namaGedung + ' (' + b.kodeGedung + ')</option>';
    }).join('');

    if (roomId) {
      const r = DB.rooms.find(function(item) { return item.ruangId === roomId; });
      if (!r) return;
      document.getElementById('modalRoomTitle').innerText = 'Edit Data Ruang';
      document.getElementById('roomFormId').value = r.ruangId;
      document.getElementById('roomFormKode').value = r.kodeRuang;
      document.getElementById('roomFormNama').value = r.namaRuang;
      gdgSelect.value = r.gedungId;
      document.getElementById('roomFormJenis').value = r.jenisRuang;
      document.getElementById('roomFormKapasitas').value = r.kapasitas;
      document.getElementById('roomFormLantai').value = r.lantai;
      document.getElementById('roomFormKondisi').value = r.kondisi;
      document.getElementById('roomFormPJ').value = r.penanggungJawab || '';
    } else {
      document.getElementById('modalRoomTitle').innerText = 'Tambah Ruang Baru';
      document.getElementById('roomFormId').value = '';
      document.getElementById('roomFormKode').value = 'R-' + String(DB.rooms.length + 1).padStart(2, '0');
    }
    openModal('modalRoom');
  }

  function editRoom(roomId) {
    openRoomModal(roomId);
  }

  function saveRoom() {
    const id = document.getElementById('roomFormId').value;
    const rData = {
      ruangId: id || ('RNG-' + Date.now()),
      kodeRuang: document.getElementById('roomFormKode').value.trim().toUpperCase(),
      namaRuang: document.getElementById('roomFormNama').value.trim(),
      gedungId: document.getElementById('roomFormGedungId').value,
      jenisRuang: document.getElementById('roomFormJenis').value,
      kapasitas: Number(document.getElementById('roomFormKapasitas').value),
      lantai: Number(document.getElementById('roomFormLantai').value),
      kondisi: document.getElementById('roomFormKondisi').value,
      penanggungJawab: document.getElementById('roomFormPJ').value.trim(),
      keterangan: 'Master data ruang'
    };

    if (id) {
      const idx = DB.rooms.findIndex(function(r) { return r.ruangId === id; });
      if (idx !== -1) DB.rooms[idx] = rData;
    } else {
      DB.rooms.push(rData);
    }

    DB.save();
    DB.logActivity('Data ruang ' + rData.namaRuang + ' disimpan', 'fa-door-open text-purple-600');
    closeModal('modalRoom');
    showToast('Data ruang berhasil disimpan!');
    renderRoomsView();
    refreshDashboard();
  }

  function renderUsersView() {
    const tbody = document.getElementById('usersTableBody');
    tbody.innerHTML = DB.users.map(function(u) {
      return '<tr class="hover:bg-cream-50/60 transition">' +
        '<td class="py-3 px-4 font-bold text-slate-800">' + u.nama + '</td>' +
        '<td class="py-3 px-4 font-mono text-xs dynamic-theme-text">' + u.username + '</td>' +
        '<td class="py-3 px-4"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-cream-100 text-slate-700">' + u.role + '</span></td>' +
        '<td class="py-3 px-4"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ' + (u.status === 'Aktif' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700') + '">' + u.status + '</span></td>' +
        '<td class="py-3 px-4 text-right space-x-1">' +
          '<button onclick="editUser(\'' + u.userId + '\')" class="p-1.5 rounded-lg text-slate-600 hover:text-slate-900"><i class="fa-solid fa-pen"></i></button>' +
          (u.username !== 'admin' ? '<button onclick="deleteUserConfirm(\'' + u.userId + '\')" class="p-1.5 rounded-lg text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>' : '') +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function openUserModal(userId) {
    document.getElementById('formUser').reset();
    const helpPwd = document.getElementById('helpUserPassword');

    if (userId) {
      const u = DB.users.find(function(item) { return item.userId === userId; });
      if (!u) return;
      document.getElementById('modalUserTitle').innerText = 'Edit Akun Pengguna';
      document.getElementById('userFormId').value = u.userId;
      document.getElementById('userFormNama').value = u.nama;
      document.getElementById('userFormUsername').value = u.username;
      document.getElementById('userFormRole').value = u.role;
      document.getElementById('userFormStatus').value = u.status;
      document.getElementById('userFormPassword').required = false;
      helpPwd.classList.remove('hidden');
    } else {
      document.getElementById('modalUserTitle').innerText = 'Tambah Akun Baru';
      document.getElementById('userFormId').value = '';
      document.getElementById('userFormPassword').required = true;
      helpPwd.classList.add('hidden');
    }
    openModal('modalUser');
  }

  function editUser(userId) {
    openUserModal(userId);
  }

  function saveUser() {
    const id = document.getElementById('userFormId').value.trim();
    const pwd = document.getElementById('userFormPassword').value;
    const btnSubmit = document.getElementById('btnSaveUserSubmit');
    const btnText = document.getElementById('btnSaveUserText');

    const uData = {
      userId: id,
      nama: document.getElementById('userFormNama').value.trim(),
      username: document.getElementById('userFormUsername').value.trim(),
      password: pwd,
      role: document.getElementById('userFormRole').value,
      status: document.getElementById('userFormStatus').value
    };

    if (!uData.nama || !uData.username) {
      showToast('Nama dan Username wajib diisi!', 'error');
      return;
    }

    if (!id && !pwd) {
      showToast('Password wajib diisi untuk akun baru!', 'error');
      return;
    }

    if (btnSubmit) btnSubmit.disabled = true;
    if (btnText) btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Menyimpan...';

    callBackendApi('saveUser', uData, function(res) {
      if (btnSubmit) btnSubmit.disabled = false;
      if (btnText) btnText.innerText = 'Simpan Akun';

      if (res && res.success) {
        uData.userId = res.userId || id || ('USR-' + Date.now());
        if (id) {
          const idx = DB.users.findIndex(function(u) { return u.userId === id; });
          if (idx !== -1) {
            if (!pwd) uData.password = DB.users[idx].password;
            DB.users[idx] = uData;
          }
        } else {
          DB.users.push(uData);
        }
        DB.save();
        renderUsersView();
        closeModal('modalUser');
        showToast(res.message || 'Akun pengguna berhasil disimpan ke Google Sheets!', 'success');
        DB.logActivity('Akun ' + uData.nama + ' disimpan di database', 'fa-users-gear text-slate-700');
      } else {
        showToast(res?.error || res?.message || 'Gagal menyimpan akun ke Google Sheets', 'error');
      }
    }, function(err) {
      if (btnSubmit) btnSubmit.disabled = false;
      if (btnText) btnText.innerText = 'Simpan Akun';
      showToast('Koneksi server gagal: ' + err.message, 'error');
    });
  }

  function deleteUserConfirm(userId) {
    const u = DB.users.find(function(item) { return item.userId === userId; });
    if (!u) return;

    promptConfirmation('Hapus Akun Pengguna', 'Hapus akun "' + u.nama + '"?', function() {
      DB.users = DB.users.filter(function(item) { return item.userId !== userId; });
      DB.save();
      showToast('Akun telah dihapus.');
      renderUsersView();

      callBackendApi('deleteUser', { userId: userId });
    });
  }

  function loadSettingsForm() {
    document.getElementById('setAppName').value = DB.settings.appName || 'DIGITAS SARPRAS';
    document.getElementById('setSchoolName').value = DB.settings.schoolName || 'SMP Negeri 2 Banyuwangi';
    document.getElementById('setSchoolAddress').value = DB.settings.schoolAddress || '';
    document.getElementById('setPrincipalName').value = DB.settings.principalName || '';
    document.getElementById('setPrincipalNIP').value = DB.settings.principalNIP || '';

    const gasInput = document.getElementById('setGasApiUrl');
    if (gasInput) {
      gasInput.value = localStorage.getItem('DS_GAS_API_URL') || GAS_API_URL || DEFAULT_GAS_API_URL;
    }
  }

  function saveAppSettings() {
    DB.settings.appName = document.getElementById('setAppName').value.trim();
    DB.settings.schoolName = document.getElementById('setSchoolName').value.trim();
    DB.settings.schoolAddress = document.getElementById('setSchoolAddress').value.trim();
    DB.settings.principalName = document.getElementById('setPrincipalName').value.trim();
    DB.settings.principalNIP = document.getElementById('setPrincipalNIP').value.trim();

    const gasInput = document.getElementById('setGasApiUrl');
    if (gasInput) {
      const newUrl = gasInput.value.trim() || DEFAULT_GAS_API_URL;
      localStorage.setItem('DS_GAS_API_URL', newUrl);
      GAS_API_URL = newUrl;
    }

    DB.save();
    updateAppIdentityUI();
    showToast('Pengaturan identitas sekolah & endpoint berhasil disimpan!');
    syncSettingsToBackend(DB.settings);
  }

  function syncSettingsToBackend(obj) {
    callBackendApi('saveSettings', obj);
  }

  function updateAppIdentityUI() {
    document.getElementById('loginAppName').innerText = DB.settings.appName;
    document.getElementById('headerAppName').innerText = DB.settings.appName;
    document.getElementById('loginSchoolName').innerText = DB.settings.schoolName;
    document.getElementById('headerSchoolName').innerText = DB.settings.schoolName;
  }

  function confirmResetData() {
    promptConfirmation('Reset Data Uji Coba', 'Seluruh modifikasi data lokal akan dikembalikan ke data contoh bawaan sekolah. Lanjutkan?', function() {
      localStorage.clear();
      location.reload();
    });
  }

  function syncDatabaseToSheets() {
    const btn = document.getElementById('btnSyncDatabase');
    const icon = document.getElementById('iconSyncDatabase');
    const text = document.getElementById('textSyncDatabase');

    icon.className = 'fa-solid fa-spinner fa-spin text-sm';
    text.innerText = 'Menyinkronkan...';
    btn.disabled = true;

    const payload = {
      assets: DB.assets,
      buildings: DB.buildings,
      rooms: DB.rooms,
      maintenance: DB.maintenance,
      procurements: DB.procurements,
      disposals: DB.disposals,
      settings: DB.settings
    };

    callBackendApi('syncAllData', payload, function(res) {
      icon.className = 'fa-solid fa-cloud-arrow-up text-sm';
      text.innerText = 'Sinkron Database';
      btn.disabled = false;

      if (res && res.success) {
        showToast(res.message || 'Sinkronisasi berhasil!', 'success');
        DB.logActivity('Sinkronisasi massal data ke Google Sheets', 'fa-cloud-arrow-up text-emerald-600');
      } else {
        showToast(res?.error || 'Gagal sinkron data.', 'error');
      }
    }, function(err) {
      icon.className = 'fa-solid fa-cloud-arrow-up text-sm';
      text.innerText = 'Sinkron Database';
      btn.disabled = false;
      showToast('Koneksi server gagal: ' + err.message, 'error');
    });
  }

  function initAppSession() {
    const header = document.getElementById('mainAppHeader');
    const bottomNav = document.getElementById('mainAppBottomNav');
    if (header) header.classList.remove('hidden');
    if (bottomNav) bottomNav.classList.remove('hidden');

    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');

    const u = DB.currentUser || { nama: 'Administrator', username: 'admin', role: 'Admin' };
    document.getElementById('userNameDisplay').innerText = u.nama;
    document.getElementById('userRoleDisplay').innerText = u.role;
    document.getElementById('dropdownUserName').innerText = u.nama;
    document.getElementById('dropdownUserEmail').innerText = u.username + '@sarpras.sch.id';

    const initials = u.nama.split(' ').map(function(n) { return n[0]; }).slice(0, 2).join('').toUpperCase() || 'AD';
    document.getElementById('userAvatarText').innerText = initials;

    applyRolePermissions();
    updateAppIdentityUI();
    populateGedungFilterDropdown();

    const isGuest = u.role === 'Guest' || u.role === 'Guest/Tamu' || u.role === 'Tamu';
    if (isGuest) {
      navigateTo('respon');
    } else {
      navigateTo('dashboard');
    }
  }

  window.addEventListener('DOMContentLoaded', function() {
    applySystemTheme(DB.settings.selectedTheme || 'magenta-rose', DB.settings.selectedFont || 'Inter');
    updateAppIdentityUI();

    if (DB.currentUser) {
      initAppSession();
    }

    callBackendApi('getInitialData', {}, function(res) {
      if (res && res.success) {
        if (res.assets && res.assets.length > 0) DB.assets = res.assets;
        if (res.buildings && res.buildings.length > 0) DB.buildings = res.buildings;
        if (res.rooms && res.rooms.length > 0) DB.rooms = res.rooms;
        if (res.users && res.users.length > 0) DB.users = res.users;
        if (res.maintenance && res.maintenance.length > 0) DB.maintenance = res.maintenance;
        if (res.procurements && res.procurements.length > 0) DB.procurements = res.procurements;
        if (res.disposals && res.disposals.length > 0) DB.disposals = res.disposals;
        if (res.settings && res.settings.length > 0) {
          res.settings.forEach(function(s) {
            DB.settings[s.settingKey] = s.settingValue;
          });
          applySystemTheme(DB.settings.selectedTheme || 'magenta-rose', DB.settings.selectedFont || 'Inter');
          updateAppIdentityUI();
        }
        DB.save();
        if (DB.currentUser) {
          const uRole = DB.currentUser.role;
          if (uRole === 'Guest' || uRole === 'Guest/Tamu' || uRole === 'Tamu') {
            navigateTo('respon');
          } else {
            refreshDashboard();
          }
        }
      }
    });
  });
</script>
